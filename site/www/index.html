<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tara Wellness — Vedic Astrology & Daily Guidance</title>
  <meta name="description" content="Tara Wellness — personalized Vedic astrology, daily guidance, and the right timing for life's big moments, tied to your unique birth chart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0a14;
      --bg2: #1a1515;
      --gold: #cda349;
      --gold-soft: #e2c878;
      --cream: #f5eee1;
      --spin: 46s;            /* mandala rotation period (slow + meditative) */
      --stagger: 72ms;        /* per-letter reveal delay */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(120% 100% at 50% 0%, #16101f 0%, var(--bg) 55%, #0a0710 100%);
      color: var(--cream);
      line-height: 1.6;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---- ambient background ---- */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .stars i {
      position: absolute;
      width: 2px; height: 2px; border-radius: 50%;
      background: var(--gold-soft);
      opacity: .0;
      animation: twinkle 5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .05; transform: scale(.8); }
      50%      { opacity: .55; transform: scale(1); }
    }

    header {
      position: relative; z-index: 2;
      padding: 22px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-family: 'Fraunces', serif;
      font-size: 20px; font-weight: 700; letter-spacing: .3px;
      color: var(--gold);
    }
    nav a {
      color: var(--cream); text-decoration: none; margin-left: 24px;
      font-size: 14px; opacity: .75; transition: opacity .3s, color .3s;
    }
    nav a:hover { opacity: 1; color: var(--gold); }

    /* ---- hero ---- */
    .hero {
      position: relative; z-index: 2;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 40px 24px 80px;
    }

    .mandala-wrap {
      position: relative;
      width: clamp(190px, 46vw, 320px);
      aspect-ratio: 1;
      display: grid; place-items: center;
      margin-bottom: 44px;
    }
    .glow {
      position: absolute; inset: -22%;
      background: radial-gradient(circle at center, rgba(205,163,73,.42) 0%, rgba(205,163,73,.14) 38%, transparent 68%);
      filter: blur(6px);
      animation: pulse 6.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%      { opacity: .9; transform: scale(1.06); }
    }
    .mandala {
      position: relative;
      width: 100%; height: 100%;
      transform-origin: 50% 50%;
      animation: spin var(--spin) linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .title {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      color: var(--gold);
      font-size: clamp(2.3rem, 8.5vw, 4.6rem);
      letter-spacing: clamp(2px, 1.2vw, 8px);
      line-height: 1.02;
      text-shadow: 0 2px 30px rgba(205,163,73,.35);
      margin-bottom: 18px;
    }
    .title span {
      display: inline-block;
      opacity: 0;
      transform: translateY(16px);
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
      animation-delay: calc(650ms + var(--i) * var(--stagger));
    }
    .title .sp { width: .4em; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .sub {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.05rem, 3.4vw, 1.5rem);
      color: var(--gold-soft);
      letter-spacing: .5px;
      opacity: 0;
      animation: fade 1.1s ease forwards;
      animation-delay: 2.0s;
    }
    .tag {
      font-size: clamp(.85rem, 2.6vw, 1rem);
      color: var(--cream);
      opacity: 0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 16px;
      animation: fade 1.1s ease forwards;
      animation-delay: 2.55s;
    }
    .cta {
      display: inline-block;
      margin-top: 42px;
      padding: 15px 38px;
      background: var(--gold);
      color: var(--bg);
      font-weight: 600; font-size: 15px;
      text-decoration: none; border-radius: 8px;
      opacity: 0;
      animation: fade 1.1s ease forwards;
      animation-delay: 3.15s;
      transition: transform .3s, box-shadow .3s;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(205,163,73,.32); }
    @keyframes fade { to { opacity: 1; } }

    footer {
      position: relative; z-index: 2;
      text-align: center; padding: 30px 24px 34px;
      border-top: 1px solid rgba(205,163,73,.16);
      font-size: 13px; color: rgba(245,238,225,.55);
    }
    footer a { color: var(--gold); text-decoration: none; margin: 0 8px; }
    footer a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .mandala, .glow, .stars i { animation: none; }
      .title span, .sub, .tag, .cta { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  </div>

    <span style="--i:0">T</span><span style="--i:1">A</span><span style="--i:2">R</span><span style="--i:3">A</span><span class="sp" style="--i:4">&nbsp;</span><span style="--i:5">W</span><span style="--i:6">E</span><span style="--i:7">L</span><span style="--i:8">L</span><span style="--i:9">N</span><span style="--i:10">E</span><span style="--i:11">S</span><span style="--i:12">S</span>
